<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orçamento</title>
    <link rel="stylesheet" href="css.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js" integrity="sha512-bLT0Qm9VnAYZDflyKcBaQ2gg0hSYNQrJ8RilYldYQ1FxQYoCLtUjuuRuZo+fjqhx/qtq/1itJ0C2ejDxltZVFg==" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <h1>Orçamentos</h1>
    </header>
    <main>
        <form id="form-orcamento">
            <section>
                <h2>Dados do Emissor</h2>
                <label for="logo">Logotipo (imagem até 2MB)</label>
                <input type="file" name="logo" id="logo">
                <label for="nome-emissor">Nome</label>
                <input type="text" id="nome-emissor">
                <label for="cpf">CPF / CNPJ</label>
                <input type="text" id="cpf">
                <label for="endereco-emissor">Endereço completo</label>
                <input type="text" id="endereco-emissor">
            </section>
            <section>
                <h2>Dados do Cliente</h2>
                <label for="nome-cliente">Nome</label>
                <input type="text" id="nome-cliente">
                <label for="cpf-cliente">CPF / CNPJ</label>
                <input type="text" id="cpf-cliente">
                <label for="endereco-cliente">Endereço Residencial</label>
                <input type="text" id="endereco-cliente">
                <label for="telefone">Telefone</label>
                <input type="text" id="telefone">
                <label for="email-cliente">E-mail</label>
                <input type="email" id="email-cliente">
            </section>
            <section id="itens-orcamento">
                <h2>Itens do Orçamento</h2>
                <div class="item-orcamento">
                    <label for="produto-servico">Produto / Serviço</label>
                    <input type="text" class="produto-servico">
                    <label for="qnt">Quantidade</label>
                    <input type="number" class="qnt" oninput="atualizarTotal(this)">
                    <label for="valor-unitario">Valor Unitário</label>
                    <input type="number" class="valor-unitario" oninput="atualizarTotal(this)">
                    <label for="total">Total</label>
                    <input type="number" class="total" readonly>
                    <button type="button" class="remove-item" onclick="removerItem(this)">Remover Item</button>
                </div>
                <button type="button" id="adicionar-item" onclick="adicionarItem()">+ Adicionar Item</button>
            </section>
            <section>
                <h2>Dados do Orçamento</h2>
                <label for="numero-orcamento">Número do orçamento</label>
                <input type="text" id="numero-orcamento">
                <label for="data-orcamento">Data</label>
                <input type="date" id="data-orcamento">
                <label for="valido-ate">Válido até</label>
                <input type="date" id="valido-ate">
                <label for="acrescimo">Acréscimo (R$)</label>
                <input type="number" id="acrescimo" oninput="atualizarTotalOrcamento()">
                <label for="motivo-acrescimo">Motivo do acréscimo</label>
                <input type="text" id="motivo-acrescimo">
                <label for="desconto">Desconto (R$)</label>
                <input type="number" id="desconto" oninput="atualizarTotalOrcamento()">
                <label for="motivo-desconto">Motivo do desconto</label>
                <input type="text" id="motivo-desconto">
                <label for="forma-pagamento">Forma de pagamento</label>
                <input type="text" id="forma-pagamento">
                <label for="observacoes">Observações</label>
                <textarea id="observacoes"></textarea>
                <h2>Total do Orçamento: R$ <span id="total-orcamento">0.00</span></h2>
            </section>
            <button type="button" id="gerar-orcamento" onclick="gerarPDF()">Gerar orçamento</button>
        </form>
    </main>
    <script src="script.js"></script>
   
</body>
</html>
