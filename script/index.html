<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barber</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo"><img src="/img/barbearia (1).png" alt="imagem" class="img">Barbearia
        </div>
   

    <nav>

        <ul>
            <li> <a href="#home">Inicio</a></s></li>
            <li> <a href="cadastro.html">Pagamento Virtual</a></s></li>
            <li> <a href="#services">Serviços</a></s></li>
            <li> <a href="#contact">Contato</a></s></li>
        </ul>
    </nav>

</header>

<main>
    <section id="schedule">
    
        <div class="calender">
            <div class="month">
                <button id="prev" onclick="prevMonth()">&#10094;</button>
                <h2 id="monthYear"></h2>
                <button id="next" onclick="nextMonth()"> &#10095;</button>
            </div>
            <div class="weekdays">
                <div>Segunda-Feira</div>
                <div>Terça-Feira</div>
                <div>Quarta-Feira</div>
                <div>Quinta-Feira</div>
                <div>Sexta-Feitra</div>
                <div>Sabado</div>
                <div>Domingo</div>

            </div>
            <div class="days" id="days"></div>
        </div>
        <div id="modal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeModal()">&times;</span>
                <h2>Agendar Horario</h2>
                <form id="appointmentForm">
                    <label for="name">Nome:</label>
                    <input type="text" id="name" required>
                    <label for="time">Horario:</label>
                    <input type="time" id="time" required>
                    <label for="tipy">Tipo De Corte:</label>
                    <select name="type" id="trype" required>
                        <option value="corte">Corte: R$: 40,00</option>
                        <option value="barba">Barba R$: 25,00</option>
                        <option value="combo">Corte e Barba R$: 65,00</option>
                        <option value="luzes">Luzes e Corte R$: 120</option>
                    </select>
                    <button type="submit">Agendar</button>
                </form>

            </div>
        </div>
        <button class="button" onclick="sendWhatsAppMessage()" type="button">Agende Pelo WhatsApp</button>
    </section>
</main>
    
<footer>
    <p> &copy: 2024 Barbearia. Todos os direitos reservados. 'João Paulo'</p>
</footer>
<script src="script.js"></script>
</body>
</html>
